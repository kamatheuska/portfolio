services:
    admin:
        image: avatarkorranika/portfolio-admin:latest
        build:
            context: .
            dockerfile: ./Dockerfile
        restart: unless-stopped
        env_file:
            - .env.prod
        # No ports exposed directly - accessed through the api nginx at /cms
        expose:
            - "3000"
        environment:
            - NODE_ENV=production
            - DATABASE_URL=file:/data/admin.db
            - PORT=3000
        volumes:
            - sqlite_data:/data
            - media:/app/media
        networks:
            - app-network

volumes:
    # Named volume for SQLite database persistence
    sqlite_data:
        driver: local
    # Named volume for uploaded media files
    media:
        driver: local

networks:
    # Network created by the portfolio-api compose project, shared with its nginx
    app-network:
        external: true
        name: portfolio-api_app-network
