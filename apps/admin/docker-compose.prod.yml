# Rotate container logs (json-file driver): keep at most 3 x 10MB per container
x-logging: &default-logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

services:
    admin:
        image: avatarkorranika/portfolio-admin:latest
        build:
            context: .
            dockerfile: ./Dockerfile
        restart: unless-stopped
        logging: *default-logging
        depends_on:
            migrations:
                condition: service_completed_successfully
        env_file:
            - .env.prod
        # No ports exposed directly - accessed through the api nginx at /cms
        expose:
            - "3000"
        environment:
            - NODE_ENV=production
            - DATABASE_URL=file:/data/admin.db
            - PORT=3000
        volumes:
            # Host directory shared with portfolio-api (admin.db + app.db)
            - /opt/portfolio/data:/data
            - media:/app/media
        networks:
            - app-network

    migrations:
        image: avatarkorranika/portfolio-admin-migrations:latest
        build:
            context: .
            dockerfile: ./Dockerfile
            target: migrations
        restart: "no"
        logging: *default-logging
        # Runs as root; hand the db (and its dir, for SQLite journal files) to the
        # admin runtime user (nextjs, uid 1001) so the app can write to it
        command: ["sh", "-c", "pnpm payload migrate && chown 1001:1001 /data /data/admin.db*"]
        env_file:
            - .env.prod
        environment:
            - NODE_ENV=production
            - DATABASE_URL=file:/data/admin.db
            - PORT=3000
        volumes:
            # Host directory shared with portfolio-api (admin.db + app.db)
            - /opt/portfolio/data:/data
            - media:/app/media
        networks:
            - app-network

    dozzle:
        image: amir20/dozzle:v11.4.0
        restart: unless-stopped
        logging: *default-logging
        # Bound to localhost only - not reachable from outside the VPS.
        # Access it through the SSH tunnel: `make logs` from the repo root.
        ports:
            - "127.0.0.1:8080:8080"
        environment:
            - DOZZLE_NO_ANALYTICS=true
            # Login required; users come from dozzle-users.yml (`make dozzle-user`)
            - DOZZLE_AUTH_PROVIDER=simple
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ./dozzle-users.yml:/data/users.yml:ro

volumes:
    # Named volume for uploaded media files
    media:
        driver: local

networks:
    # Network created by the portfolio-api compose project, shared with its nginx
    app-network:
        external: true
        name: portfolio-api_app-network
