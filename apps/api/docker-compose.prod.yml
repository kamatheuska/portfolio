services:
    api:
        image: avatarkorranika/portfolio-api:latest
        build:
            context: .
            dockerfile: ./Dockerfile
        restart: unless-stopped
        env_file:
            - .env.prod
        # No ports exposed directly - accessed through nginx
        expose:
            - "3000"
        environment:
            - NODE_ENV=production
            - DB_FILE_NAME=/data/app.db
            - DB_ADMIN_FILE_NAME=/data/admin.db
            - FASTIFY_CLOSE_GRACE_DELAY=500
            - LOG_LEVEL=debug
            - PORT=3000
        volumes:
            # Host directory shared with portfolio-admin (app.db + admin.db)
            - /opt/portfolio/data:/data
        networks:
            - app-network
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
                ]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 5s

    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
            - /opt/portfolio/ssl:/etc/nginx/ssl:ro
            - /opt/portfolio-api/apps/api/logs/nginx:/var/log/nginx
        networks:
            - app-network
        depends_on:
            - api

networks:
    app-network:
        driver: bridge
